openapi: 3.0.3
info:
  title: Creators Marketplace API
  version: 0.1.0
  description: MVP REST API for listings and booking requests.
servers:
  - url: http://localhost:3001
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: stub-jwt
  schemas:
    Listing:
      type: object
      required: [id, creatorId, title, description, price, currency, active]
      properties:
        id: { type: string }
        creatorId: { type: string }
        title: { type: string }
        description: { type: string }
        price: { type: integer, minimum: 0 }
        currency: { type: string, example: USD }
        active: { type: boolean }
    Booking:
      type: object
      required: [id, clientId, creatorId, listingId, startAt, endAt, status, amount, currency]
      properties:
        id: { type: string }
        clientId: { type: string }
        creatorId: { type: string }
        listingId: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, confirmed, completed, cancelled] }
        amount: { type: integer }
        currency: { type: string }
paths:
  /health:
    get:
      summary: Health check
      responses: { '200': { description: Healthy } }
  /auth/register:
    post:
      summary: Register a stub user
      responses: { '201': { description: Registered } }
  /auth/login:
    post:
      summary: Log in and receive a stub token
      responses: { '201': { description: Logged in } }
  /auth/me:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Current user } }
  /users/me:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Current profile } }
  /listings:
    get:
      responses: { '200': { description: Active listings } }
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Listing created } }
  /listings/{id}:
    get:
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Listing detail } }
  /bookings:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Role-filtered bookings } }
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Pending booking created } }
  /bookings/{id}:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Booking detail } }
  /bookings/{id}/confirm:
    post:
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Confirmed booking } }
